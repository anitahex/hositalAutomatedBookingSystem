# Port 80: ACME challenge passthrough (for certbot, see certbot-entrypoint.sh) plus a
# redirect of everything else to HTTPS. The redirect target is the sslip.io hostname
# itself, not $host — hitting the bare IP or the legacy :8010 port must not redirect
# somewhere the certificate's SAN doesn't cover (that would show a browser cert-mismatch
# error instead of a clean redirect).
server {
    listen 80;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://165-232-178-215.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 165-232-178-215.sslip.io;

    # frontend-entrypoint.sh guarantees a certificate (real or a transient self-signed
    # placeholder) always exists at this path before nginx starts — see that script's
    # docstring-style comment for why.
    ssl_certificate     /etc/letsencrypt/live/165-232-178-215.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/165-232-178-215.sslip.io/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Matches app/services/document_pipeline.py's 15MB upload cap with headroom for
    # multipart overhead — without this, nginx's 1MB default silently 413s uploads
    # the backend would otherwise accept (see FULL_SYSTEM_AUDIT.md P0 #3).
    client_max_body_size 20m;

    # Baseline security headers (FULL_SYSTEM_AUDIT.md P0 #3). Repeated inside the
    # /static/ location below because nginx does not inherit add_header directives
    # into a location that sets its own (it already sets Cache-Control there).
    #
    # NOT included yet: Strict-Transport-Security. Add it here (and in /static/ below)
    # only after HTTPS is confirmed working end-to-end against the real certificate —
    # see the plan's manual bootstrap sequence, step 8. Enabling HSTS before that's
    # confirmed would make the site unreachable with no fallback if TLS turns out to be
    # broken.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self) is required for the doctor consult audio recording feature
    # (getUserMedia); everything else this app doesn't use is denied outright.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
    # 'unsafe-inline' for script-src/style-src is required by this app's existing
    # inline <script> in index.html and inline style="" attributes throughout —
    # removing those would need a separate frontend refactor. connect-src allows
    # ws:/wss: for the consult-audio and chat-stream WebSocket/SSE connections.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # WebSocket proxy — must be matched before the general API block
    location /ws/ {
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # API routes — proxied to FastAPI backend
    location ~ ^/(auth|chat|appointments|admin|webhooks|health)(/|$) {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Doctor consult audio WebSocket — matched before the general doctor API block
    # below since it needs the Upgrade/Connection headers that block doesn't set.
    location ~ ^/doctor/consult/[^/]+/audio$ {
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Doctor API — scoped narrowly so /doctor/set-password (a client-side
    # SPA page, not a backend endpoint) falls through to the SPA fallback below
    # instead of being proxied here.
    location ~ ^/doctor/(auth|me|appointments|patients|consult)(/|$) {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets — served by nginx with caching
    location /static/ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
        # Duplicated from the server block: a location with its own add_header
        # does not inherit the server block's add_header directives in nginx.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # Everything else — SPA fallback serves index.html
    location / {
        try_files $uri /index.html;
    }
}
