server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket proxy — must be matched before the general API block
    location /ws/ {
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # API routes — proxied to FastAPI backend
    location ~ ^/(auth|chat|appointments|admin|health)(/|$) {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets — served by nginx with caching
    location /static/ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Everything else — SPA fallback serves index.html
    location / {
        try_files $uri /index.html;
    }
}
