# Reference nginx server block for this app.
#
# This app does NOT terminate TLS or own :80/:443 itself. It is deployed on a shared
# host whose nginx already fronts ~40 other sites, so the only workable contract is:
#
#     internet -> host nginx (TLS) -> 127.0.0.1:8010 -> this app's backend container
#
# The backend serves *everything* — the HTML page at /, /static/*, the JSON API, and
# the WebSocket endpoints — so this is a pure reverse proxy with a single location.
# docker-compose.yml publishes the backend on 127.0.0.1:8010 to match.
#
# THE AUTHORITATIVE COPY OF THIS CONFIG LIVES ON THE HOST (under
# /etc/nginx/sites-available/). This file is a version-controlled reference so the
# deployment contract is not invisible; if you change one, change the other.

server {
    listen 443 ssl;
    server_name 165-232-178-215.sslip.io;

    # Certificates are issued and renewed by the host's existing certbot setup,
    # shared with the other sites on this box — not by anything in this repo.
    # ssl_certificate     /etc/letsencrypt/live/<name>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<name>/privkey.pem;

    # Matches app/services/document_pipeline.py's 15MB upload cap, with headroom for
    # multipart overhead. Without this, nginx's 1MB default silently 413s uploads the
    # backend would otherwise accept.
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self) is required by the doctor consult audio recording feature
    # (getUserMedia); everything else this app doesn't use is denied outright.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
    # 'unsafe-inline' is required by this app's existing inline <script> in index.html
    # and inline style="" attributes; removing those needs a separate frontend refactor.
    # connect-src allows ws:/wss: for the consult-audio and chat-stream connections.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        # Forwarding the client's own Upgrade/Connection headers makes this one
        # location serve both normal requests and WebSocket upgrades, without needing
        # a `map $http_upgrade $connection_upgrade` in the http block — which matters
        # on a shared host where that http block belongs to every other site too.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Consult audio WebSockets stay open for the length of a consultation.
        proxy_read_timeout 86400;
    }
}
