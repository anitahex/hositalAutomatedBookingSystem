services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: hospital_db
    # No ports: mapping — only the backend container needs to reach this, over the
    # internal compose network (postgres:5432), regardless of any host port
    # mapping. Publishing it to the host previously conflicted with a native
    # Postgres install locally, and left it reachable from the public internet on
    # the server (no ufw rule blocked it). If you need host-side access for local
    # debugging, add a docker-compose.override.yml (gitignored) with your own
    # `ports: ["5433:5432"]` instead of editing this file.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 15

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/hospital_db
      QDRANT_MODE: remote
      QDRANT_URL: http://qdrant:6333
      CHECKPOINT_DB_PATH: /app/data/checkpoints.sqlite
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 150s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "8010:80"   # kept so old bookmarks still work — Caddy 301-redirects this to https
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  app_data:
  caddy_data:
  caddy_config:
