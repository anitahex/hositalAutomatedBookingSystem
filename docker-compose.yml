services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: hospital_db
    # No ports: mapping — only the backend container needs to reach this, over the
    # internal compose network (postgres:5432), regardless of any host port
    # mapping. Publishing it to the host previously conflicted with a native
    # Postgres install locally, and left it reachable from the public internet on
    # the server (no ufw rule blocked it). If you need host-side access for local
    # debugging, add a docker-compose.override.yml (gitignored) with your own
    # `ports: ["5433:5432"]` instead of editing this file.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 15

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/hospital_db
      QDRANT_MODE: remote
      QDRANT_URL: http://qdrant:6333
      CHECKPOINT_DB_PATH: /app/data/checkpoints.sqlite
    ports:
      # TLS and public routing are handled by a reverse proxy on the host, NOT by
      # this stack — the deployment target is a shared box whose nginx already
      # fronts ~40 other sites, so this app can never own :80/:443. Bound to
      # loopback so only that local proxy can reach it, never the public internet.
      # The host proxy forwards to this port; if yours uses a different one,
      # change the left-hand side only.
      - "127.0.0.1:8010:8010"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 150s

volumes:
  postgres_data:
  qdrant_data:
  app_data:
