  fixtures exist only to exercise the rendering path; no figure here is claimed to be
  real data, and nothing in the application ships with them.

  ?axe=1                  runs axe-core inside the frame and writes results to #out.
  ?drill=<tile>           clicks that activity tile and waits for its list to render.
  ?escape=1               (with drill) presses Escape inside the open list.
  ?glowprobe=<sel,...>    distance of each element from the hero's radial glow, for
                          contrast axe cannot compute through the gradient.
  ?overflow=1             reports anything in the hero wider than its box.
  ?scrollto=<sel>         scrolls an element to the top before a screenshot.
-->

// ── ?patient=<flow>: the PATIENT chat — attachments, consent at Send, End chat ─────────
// The real app code runs against a mocked API, and each flow is driven by real clicks and
// keys. #out gets JSON: what the page showed at each step, and every request it sent.
//   attach3        three files -> pills -> Send -> one consent dialog -> Store & analyse
//   cap            four files chosen at once -> only three are added
//   remove         two files, remove one pill -> that file is discarded on the server
//   discard        a file and some text -> Discard -> only the text is sent
//   cancelconsent  Esc on the consent dialog -> nothing sent, attachment kept
//   endmid         End chat while a reply is still streaming -> reply dropped, × clears
//   endesc         Esc on the End dialog -> back to the chat, focus on End chat
//   endpending     End chat with an unsent attachment -> it is discarded on the server
//   typedclose     the assistant closes the chat -> closed dialog -> Esc clears
// ?hold=consent|end|closed stops with that dialog open, for a screenshot or ?axe=1.
async function runPatientChat(win, doc) {
  const flow = params.get("patient");
  const hold = params.get("hold");
  const report = { flow, steps: [] };
  const wait = (ms) => new Promise((r) => win.setTimeout(r, ms));
  const until = async (test, ms = 4000) => {
    const end = Date.now() + ms;
    while (Date.now() < end) {
      if (test()) return true;
      await wait(50);
    }
    return false;
  };
  const step = (name, extra = {}) => report.steps.push({ name, ...extra });
  const $ = (sel) => doc.querySelector(sel);
  const visible = (sel) => { const el = $(sel); return !!el && !el.classList.contains("hidden"); };
  const reply = (body, status = 200) => ({
    ok: status < 400, status, json: async () => body, text: async () => JSON.stringify(body),
  });
  const encoder = new win.TextEncoder();
  const ndjson = (events) => events.map((e) => JSON.stringify(e)).join("\n") + "\n";
  let streamMode = flow === "endmid" ? "hang" : flow === "typedclose" ? "close" : "normal";
  let abortSeen = false;

  win.__requests = [];
  win.fetch = async (url, options = {}) => {
    const u = String(url);
    const method = String(options.method || "GET").toUpperCase();
    let body = options.body || null;
    if (body && typeof body !== "string") {
      // FormData: record the file name only.
      body = { file: body.get && body.get("file") ? body.get("file").name : null };
    }
    win.__requests.push({ method, url: u, body });
    if (u.includes("/chat/upload")) {
      await wait(300);
      const name = body && body.file;
      if (name && name.includes("holiday")) {
        return reply({ detail: "Invalid document type. Only verified medical records are supported." }, 400);
      }
      return reply({ requires_consent: true, document_token: `tok-${name}` });
    }
    if (u.includes("/chat/confirm-processing")) {
      const sent = JSON.parse(options.body);
      return reply({ status: sent.consent_granted ? "processing" : "cancelled" });
    }
    if (u.includes("/chat/stream")) {
      const sent = JSON.parse(options.body);
      const finalState = { ...sent.state, awaiting: null, chat_closed: streamMode === "close" };
      const text = streamMode === "close" ? "The chat is now closed." : `Reply to: ${sent.message}`;
      const stream = new win.ReadableStream({
        start(controller) {
          controller.enqueue(encoder.encode(ndjson([{ type: "start_response" }, { type: "token", token: text.slice(0, 5) }])));
          if (options.signal) {
            options.signal.addEventListener("abort", () => {
              abortSeen = true;
              try { controller.error(new win.DOMException("The operation was aborted.", "AbortError")); } catch (e) { /* closed */ }
            });
          }
          if (streamMode === "hang") return;  // a reply still streaming when End is pressed
          controller.enqueue(encoder.encode(ndjson([
            { type: "token", token: text.slice(5) },
            { type: "final", response: text, state: finalState, token_usage: {} },
          ])));
          controller.close();
        },
      });
      return new win.Response(stream, { status: 200, headers: { "Content-Type": "application/x-ndjson" } });
    }
    if (u.includes("/chat/records")) return reply(PATIENT_RECORDS);
    if (u.includes("/chat/documents/") && u.endsWith("/file")) {
      const png = Uint8Array.from(atob("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="), (c) => c.charCodeAt(0));
      const isImage = u.includes("scan1");
      return new win.Response(isImage ? png : new win.Blob(["%PDF-1.4 fixture"]), {
        status: 200, headers: { "Content-Type": isImage ? "image/png" : "application/pdf" } });
    }
    if (u.includes("/auth/me")) return reply({ user: FIXTURES_PATIENT });
    if (u.includes("/appointments")) return reply({ bookings: [] });
    return reply({});
  };

  const PATIENT_RECORDS = {
    documents: [
      { document_id: "lab1", document_ids: ["lab1", "lab1b"], session_id: "s1", original_filename: "Lab_Report.pdf",
        document_type: "blood_report", clinical_date: "2026-09-20", uploaded_at: "2026-09-20T10:00:00",
        content_type: "application/pdf", copies: 2, ingestion_status: "complete", status: "verified",

document.getElementById("frame").addEventListener("load", async () => {
  const frame = document.getElementById("frame");
  const win = frame.contentWindow;
  const doc = frame.contentDocument;

  try {
    if (params.get("doctor")) {
      const report = await runDoctorChecks(win, doc);
      if (runAxe) {
        await new Promise((resolve, reject) => {
          const s = doc.createElement("script");
          s.src = "/static/_axe.js";
          s.onload = resolve;
          s.onerror = () => reject(new Error("could not load axe into the frame"));
          doc.head.appendChild(s);
        });
        const open = Array.from(doc.querySelectorAll(".closed-modal")).find((m) => !m.classList.contains("hidden"));
        const roots = { glance: "#doctorOverviewBlock", history: "#doctorOverviewBlock", actions: "#doctorOverviewReviews",
                        auditlog: "#doctorActivityLog", nutrition: ".doctor-nutrition" };
        const root = open || doc.querySelector(roots[params.get("doctor")]) || doc.body;
        const results = await win.axe.run(root, {
          runOnly: { type: "tag", values: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa"] },
        });
        report.axe = {
          root: root.id || root.className,
          violations: results.violations.map((v) => ({ id: v.id, impact: v.impact, nodes: v.nodes.map((n) => n.target) })),
          passes: results.passes.length,
        };
      }
      out.textContent = "DOCTOR_DONE " + JSON.stringify(report, null, 1);
      return;
    }
    if (params.get("patient")) {
      const report = await runPatientChat(win, doc);
      if (runAxe) {
        await new Promise((resolve, reject) => {
          const s = doc.createElement("script");
          s.src = "/static/_axe.js";
          s.onload = resolve;
          s.onerror = () => reject(new Error("could not load axe into the frame"));
          doc.head.appendChild(s);
        });
        const open = Array.from(doc.querySelectorAll(".closed-modal")).find((m) => !m.classList.contains("hidden"));
        const root = open || (params.get("patient") === "records" ? doc.querySelector("#pageRecords") : null)
          || doc.querySelector("#chatForm").closest("section") || doc.body;
        const results = await win.axe.run(root, {
          runOnly: { type: "tag", values: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa"] },
        });
        report.axe = {
          root: root.id || root.className,
          violations: results.violations.map((v) => ({ id: v.id, impact: v.impact, nodes: v.nodes.map((n) => n.target) })),
          passes: results.passes.length,
        };
      }
      out.textContent = "PATIENT_DONE " + JSON.stringify(report, null, 1);
      return;
    }
    // Every request the app makes, in order, with its method and body — so a flow can be
    // checked for WHAT it sent and in WHICH order (save before sign), not just what painted.
    win.__requests = [];
    // ?fail=clinical-put makes the clinical-item save fail, to prove approve stops.
    const failures = (params.get("fail") || "").split(",").filter(Boolean);
    const reply = (body, status = 200) => ({
      ok: status < 400, status, json: async () => body, text: async () => JSON.stringify(body),
    });

    // Intercept the workspace's own fetches so render paths run exactly as they do in
    // production, just against fixtures instead of a live API.
    win.fetch = async (url, options = {}) => {
      const u = String(url);
      const method = String(options.method || "GET").toUpperCase();
      win.__requests.push({ method, url: u, body: options.body || null });
      if (failures.includes("clinical-put") && method === "PUT" && u.includes("/clinical-items/")) {
        return reply({ detail: "Simulated save failure" }, 500);
      }
      // ?generateflow=1: drafting a note takes a while, as a model call does; ?fail=generate
      // makes it fail the way the server did ("Could not generate a structured note").
      // ?discardflow=1: the server's answer to a discard — the consult, now discarded.
      if (method === "POST" && u.endsWith("/discard")) {
        return reply({ id: "c1", status: "discarded", started_at: "2026-09-21T13:00:00",
                       ended_at: "2026-09-21T13:04:12" });
      }
      if (method === "POST" && u.includes("/soap/generate")) {
        await new Promise((r) => win.setTimeout(r, 1500));
        return failures.includes("generate")
          ? reply({ detail: "Could not generate a structured clinical note from this transcript. Please try again." }, 502)
          : reply(NOTE);
      }
      // ?race=1: two patients whose overview cards arrive in the WRONG order — A's is slow
      // (as a card needing the model is), B's instant (as a cached one is).
      const race = params.get("race") === "1" && u.match(/\/doctor\/patients\/(p[AB])(\/[a-z-]+)?$/);
      if (race) {
        const who = race[1], sub = race[2] || "";
        if (sub === "/overview") {
          if (who === "pA") await new Promise((r) => win.setTimeout(r, 600));
          return reply({ mode: "structured", reason: "", facts: [], lines: [
            { heading: "Diagnoses", items: [{ text: `DIAGNOSIS OF PATIENT ${who.slice(1)}`, label: null }] },
          ] });
        }
        if (sub === "") {
          return reply({ patient_id: who, patient_name: `Patient ${who.slice(1)}`,
                         name: `Patient ${who.slice(1)}`, visits: [] });
        }
        return reply({});
      }
      let body = {};
      if (u.includes("/doctor/me")) body = { doctor: FIXTURES.doctor };
      else if (u.includes("activity-items")) {
        body = FIXTURES.items[new URL(u, location.href).searchParams.get("tile")] || {};
      }
      else if (u.includes("activity-summary")) body = FIXTURES.summary;
      else if (u.includes("activity-log")) body = FIXTURES.log;
      else if (u.includes("/doctor/reviews")) {
        body = u.includes("scope=completed") ? FIXTURES.reviewsCompleted : FIXTURES.reviews;
      }
      else if (u.endsWith("/doctor/patients/p1")) body = FIXTURES.patient;
      // BEFORE the /doctor/appointments branch: the context URL is
      // /doctor/appointments/{id}/context and would otherwise be shadowed by it.
      else if (u.includes("/context")) body = FIXTURES.bookingContext;
      // BEFORE the /doctor/appointments branch too: /doctor/appointments/{id}/brief.
      // ?brieffail=1: the brief request fails, as a server error would.
      else if (u.includes("/brief") && params.get("brieffail") === "1") return reply({ detail: "Server error" }, 500);
      else if (u.includes("/brief")) body = FIXTURES.brief;
      else if (u.includes("/nutrition")) body = FIXTURES.nutrition;
      else if (u.includes("/doctor/appointments")) body = FIXTURES.appointments;
      // The note must come from HERE, not from a renderNoteDraft() call in this harness.
      // loadSoapNote() assigns the app's own module-level doctorCurrentNote and then
      // re-renders; a direct render call is overwritten by that async continuation, which
      // left the SOAP fields empty and meant axe was auditing a blank note.
      else if (u.includes("/soap/verified-sections")) body = { sections: [] };
      else if (u.includes("/plan-medications")) body = {

      await win.loadDoctorPatientDetail("p1");
      for (let i = 0; i < 40 && doc.querySelector("#doctorOverviewMode").textContent === "Loading…"; i++) {
        await new Promise((r) => win.setTimeout(r, 50));
      }
      if (!runAxe && !params.get("inspect") && !params.get("contrast")) {
        out.textContent = "OVERVIEW_OK mode=" + doc.querySelector("#doctorOverviewMode").textContent
          + " lines=" + doc.querySelectorAll("#doctorOverviewLines p").length
          + " note=" + JSON.stringify(doc.querySelector("#doctorOverviewNote").textContent.slice(0, 70));
        return;
      }
    }

    // ?timeline=1 renders the cross-doctor timeline from a fixture that includes a
    // RESTRICTED encounter, an encounter with no signed note, and a cancelled one — the
    // three states that must look different from each other.
    if (params.get("timeline") === "1") {
      const nativeFetch = window.fetch.bind(window);
      // ?filtersfail=1: the first filters request fails, as it did under the deadlocks;
      // opening the tab must fetch them again.
      let filterCalls = 0;
      win.fetch = async (url, options) => {
        const u = String(url);
        if (u.includes("/timeline/filters")) {
          filterCalls += 1;
          if (params.get("filtersfail") === "1" && filterCalls === 1) {
            return new Response(JSON.stringify({ detail: "boom" }), { status: 500 });
          }
          return nativeFetch("data:application/json," + encodeURIComponent(JSON.stringify({
            departments: ["Cardiology", "Nephrology", "Psychiatry"],
            doctors: [{doctor_id: "d1", name: "Dr. Ajit Singh Narula"}],
            document_types: ["blood_report", "mri_report", "xray_report", "prescription", "sleep_study_report"],
            // Which document types each department/doctor's visits hold (narrowTimelineFilters).
            facets: [
              { department: "Cardiology", doctor_id: "dc", doctor_name: "Dr. Cardio", document_types: ["xray_report"] },
              { department: "Nephrology", doctor_id: "d1", doctor_name: "Dr. Ajit Singh Narula", document_types: ["mri_report", "prescription"] },
              { department: "Psychiatry", doctor_id: "dp", doctor_name: "Dr. Psych", document_types: [] },
            ],
            unlinked_document_types: ["blood_report", "sleep_study_report"],
          })));
        }
        if (u.includes("/timeline")) return nativeFetch("/static/_timeline.json");
        if (u.includes("/doctor/patients/")) {
          return nativeFetch("data:application/json," + encodeURIComponent(JSON.stringify(FIXTURES.patient)));
        }
        return nativeFetch(url, options);
      };
      doc.querySelectorAll("body > section").forEach((el) => el.classList.add("hidden"));
      doc.querySelector("#doctorDashboardView")?.classList.remove("hidden");
      doc.querySelector("#doctorPatientDetailPane")?.classList.remove("hidden");
      // Driven through the REAL patient-open path. timelineState is a module-level
      // const, which a classic script does not expose on window, so it cannot be set
      // from here — and going through loadDoctorPatientDetail is better verification
      // anyway, because it exercises the wiring rather than bypassing it.
      await win.loadDoctorPatientDetail("p1");
      await new Promise((r) => win.setTimeout(r, 300));
      const filtersBeforeTab = doc.querySelectorAll("#doctorTimelineDocType option").length - 1;
      // ?cascade=1: pick a department, then a doctor, and report what each dropdown offers.
      const optionsOf = (id) => [...doc.querySelectorAll(`${id} option`)].slice(1).map((o) => o.textContent);
      const choose = (id, value) => {
        const select = doc.querySelector(id);
        select.value = value;
        select.dispatchEvent(new Event("change"));
      };
      if (params.get("cascade") === "1") {
        const steps = { all: { doctors: optionsOf("#doctorTimelineDoctor"), types: optionsOf("#doctorTimelineDocType") } };
        choose("#doctorTimelineDocType", "blood_report");
        choose("#doctorTimelineDepartment", "Nephrology");
        steps.nephrology = { doctors: optionsOf("#doctorTimelineDoctor"), types: optionsOf("#doctorTimelineDocType"),
                             typeKept: doc.querySelector("#doctorTimelineDocType").value };
        choose("#doctorTimelineDepartment", "Psychiatry");
        steps.psychiatry = { doctors: optionsOf("#doctorTimelineDoctor"), types: optionsOf("#doctorTimelineDocType") };
        choose("#doctorTimelineDepartment", "");
        choose("#doctorTimelineDoctor", "dc");
        steps.cardioDoctor = { types: optionsOf("#doctorTimelineDocType") };
        out.textContent = "CASCADE " + JSON.stringify(steps);
        return;
      }
      win.setDoctorPatientTab("timeline");
      await new Promise((r) => win.setTimeout(r, 400));
      [...doc.querySelectorAll("#doctorTimelineList details")].slice(0, 2)
        .forEach((el) => { el.open = true; });
      const docEntry = doc.querySelector(".doctor-timeline-document");
      if (params.get("scrolldoc") === "1") docEntry?.scrollIntoView({ block: "center" });
      if (!runAxe && !params.get("inspect") && !params.get("contrast")) {
        out.textContent = "TIMELINE_OK rows=" + doc.querySelectorAll("#doctorTimelineList details").length
          + " docEntry=" + JSON.stringify(docEntry ? docEntry.textContent.replace(/\s+/g, " ").trim() : null)
          + " restricted=" + doc.querySelectorAll("#doctorTimelineList .is-warn").length
          + " count=" + JSON.stringify(doc.querySelector("#doctorTimelineCount").textContent)
          + " filterCalls=" + filterCalls + " typesBeforeTab=" + filtersBeforeTab
          + " departments=" + (doc.querySelectorAll("#doctorTimelineDepartment option").length - 1)
          + " doctors=" + (doc.querySelectorAll("#doctorTimelineDoctor option").length - 1)
          + " types=" + JSON.stringify([...doc.querySelectorAll("#doctorTimelineDocType option")].slice(1)
            .map((o) => o.textContent + "=" + o.value))
          + " cards=" + JSON.stringify([...doc.querySelectorAll("#doctorPatientDetailPane .admin-inline-card .admin-inline-meta")]
            .map((el) => el.textContent).slice(0, 4));
        return;
      }
    }

    // ?viewer=1 opens the document viewer on a REAL PDF pulled from storage, with the
    // real captured clinical payload beside it. The app's own fetch is intercepted so the
    // authenticated file route resolves to that PDF without a live doctor session.
    if (params.get("viewer") === "1") {
      // The PARENT page's native fetch, not win.fetch — win.fetch is already the fixture
      // stub installed above, which returns a plain object with no .blob(). The viewer
      // needs a real Response.
      const nativeFetch = window.fetch.bind(window);
      win.fetch = async (url, options) => {
        const u = String(url);
        if (u.includes("/file")) {
          const k = params.get("kind");
          // "unknown" serves IMAGE bytes with an unrecognised content type — the real
          // hazard, since that is what a file with no usable extension produces.
          return nativeFetch((k === "image" || k === "unknown") ? "/static/_sample.png" : "/static/_sample.pdf");
        }
        if (u.includes("/clinical")) {
          // ?review=verified|flagged|mine loads the fixture with that review state.
          const review = params.get("review");
          return nativeFetch(review ? `/static/_clinical_${review}.json` : "/static/_clinical.json");
        }
        if (u.includes("/nutrition")) return nativeFetch("/static/_nutrition.json");
        // ?reviewflow=1: the POST a click on "Mark verified" makes, answered as the server would.
        if (u.includes("/review")) {
          win.__reviewPosted = JSON.parse(options.body);
          return new Response(JSON.stringify({ document_id: "d1", review: {
            status: "verified", mine: "verified", flagged_by: [],
            verified_by: [{ name: "Dr. Mihir Thanvi", department: "Orthopedics", at: "2026-09-28T10:00:00", is_me: true }],
          } }), { status: 200, headers: { "Content-Type": "application/json" } });
        }
        return nativeFetch(url, options);
      };
      if (params.get("reviewflow") === "1") win.confirm = () => true;
      doc.querySelectorAll("body > section").forEach((el) => el.classList.add("hidden"));
      await win.openDoctorDocumentViewer("p1", {
        document_id: "d1",
        original_filename: "Lab_Report_Anit_Kumar_20Sep2026.pdf",
        document_type: "blood_report",
        clinical_date: "2026-09-20",
        // ?kind=image exercises the image branch; ?kind=unknown exercises what happens
        // when the stored file has an extension the type allowlist does not recognise.
        content_type: params.get("kind") === "image" ? "image/png"
                    : params.get("kind") === "unknown" ? "application/octet-stream"
                    : "application/pdf",
      });
      if (params.get("reviewflow") === "1") {
        await new Promise((r) => win.setTimeout(r, 600));
        [...doc.querySelectorAll(".doctor-review-actions button")].find((b) => b.textContent === "Mark verified")?.click();
        await new Promise((r) => win.setTimeout(r, 400));
      }
      // ?nutrition=veg|non_veg opens the AI nutritionist and picks that diet.
      if (params.get("nutrition")) {
        await new Promise((r) => win.setTimeout(r, 600));
        doc.querySelector(".doctor-nutrition-toggle")?.click();
        await new Promise((r) => win.setTimeout(r, 500));
        if (params.get("nutrition") === "non_veg") {
          [...doc.querySelectorAll(".doctor-nutrition-diet")].find((b) => b.textContent === "Non-vegetarian")?.click();
          await new Promise((r) => win.setTimeout(r, 200));
        }
        doc.querySelector(".doctor-nutrition")?.scrollIntoView();
      }
      // Polled by CDP in REAL time — --virtual-time-budget fast-forwards timers and
      // breaks PDF.js's worker handshake, so it cannot be used to verify this.
      win.__viewerPoll = win.setInterval(() => {
        const canvas = doc.querySelector("#doctorViewerCanvas");
        const status = doc.querySelector("#doctorViewerStatus")?.textContent || "";
        out.textContent = "VIEWER canvas=" + canvas.width + "x" + canvas.height
          + " page=" + (doc.querySelector("#doctorViewerPage")?.textContent || "")
          + " abnormal=" + doc.querySelectorAll(".doctor-abnormal-list li").length
          + " groups=" + JSON.stringify([...doc.querySelectorAll("#doctorViewerSummary > .admin-inline-meta")].map((el) => el.textContent))
          + " heading=" + JSON.stringify(doc.querySelector(".doctor-abnormal-heading")?.textContent || "")
          + " sentences=" + doc.querySelectorAll("#doctorViewerSummary .clinical-note-line").length
          + " incomplete=" + Boolean(doc.querySelector(".doctor-completeness-warn"))
          + " review=" + JSON.stringify((doc.querySelector(".doctor-review-block")?.textContent || "").replace(/\s+/g, " ").trim())
          + " posted=" + JSON.stringify(win.__reviewPosted || null)
          + " nutrition=" + JSON.stringify({
            items: doc.querySelectorAll(".doctor-nutrition-item").length,
            pressed: doc.querySelector(".doctor-nutrition-diet[aria-pressed='true']")?.textContent || null,
            first: (doc.querySelector(".doctor-nutrition-item")?.textContent || "").replace(/\s+/g, " ").slice(0, 400),
          })
          + " status=" + JSON.stringify(status);
      }, 300);
      if (!runAxe && !params.get("inspect") && !params.get("contrast")) return;
    }

    // ?inspect=<selector,selector> reports each element's text, hidden state and key
    // attributes — the frame's DOM is not in --dump-dom, so this is how frame state is
    // read back.
    const inspect = params.get("inspect");
    if (inspect) {
      const rows = inspect.split(",").map((sel) => {
        const els = [...doc.querySelectorAll(sel.trim())];
        if (!els.length) return sel.trim() + " -> NOT FOUND";
        return els.map((el, i) => {
          const cs = win.getComputedStyle(el);
          const text = (el.textContent || "").trim().replace(/\s+/g, " ").slice(0, 90);
          return `${sel.trim()}[${i}] <${el.tagName.toLowerCase()}> vis=${cs.display !== "none" && cs.visibility !== "hidden"}`
            + ` active=${el.classList.contains("is-active")}`
            + ` pressed=${el.getAttribute("aria-pressed")}`
            + ` expanded=${el.getAttribute("aria-expanded")}`
            + ` focused=${doc.activeElement === el}`
            + ` text="${text}"`;
        }).join("\n");
      });
      out.textContent = "INSPECT_DONE pane=" + pane + "\n" + rows.join("\n");
      return;
    }

    // ?scrollto=<selector> brings an element to the top of the frame before a screenshot —
    // at narrow widths the stacked sidebar pushes the content below the fold.
    const scrollTo = params.get("scrollto");
    if (scrollTo) doc.querySelector(scrollTo)?.scrollIntoView({ block: "start" });

    // ?overflow=1 reports any element in the hero wider than its box — the layout failure
    // a narrow screen produces and a screenshot at desktop width cannot show.
    if (params.get("overflow") === "1") {
      const hero = doc.querySelector(".doctor-ai-hero");
      const bad = [...hero.querySelectorAll("*")].filter((el) => el.scrollWidth > el.clientWidth + 1
        && win.getComputedStyle(el).overflowX !== "auto" && win.getComputedStyle(el).overflowX !== "scroll"
        && el.clientWidth > 0);
      const hr = hero.getBoundingClientRect();
      const escaping = [...hero.querySelectorAll(".doctor-ai-drill-row, .doctor-ai-tile")].filter((el) => {
        const r = el.getBoundingClientRect(); return r.right > hr.right + 0.5 || r.left < hr.left - 0.5;
      });
      out.textContent = `OVERFLOW_DONE hero=${Math.round(hr.width)} overflowing=${bad.length} escaping=${escaping.length}\n`
        + bad.slice(0, 10).map((el) => `${el.className || el.tagName} scroll=${el.scrollWidth} client=${el.clientWidth}`).join("\n");
      return;
    }

    // ?scrollprobe=1 (with vh=1): is the PAGE taller than the window, which boxes scroll, and
    // which elements reach below the bottom of the window — the "page keeps scrolling into
    // blank space" failure, which only shows at a real viewport height.
    if (params.get("scrollprobe") === "1") {
      const vh = win.innerHeight;
      const se = doc.scrollingElement;
      const scrollers = [...doc.querySelectorAll("*")].filter((el) => {
        const s = win.getComputedStyle(el);
        return /(auto|scroll)/.test(s.overflowY) && el.scrollHeight > el.clientHeight + 1 && el.clientHeight > 0;
      }).map((el) => `${el.id || el.className || el.tagName} client=${el.clientHeight} scroll=${el.scrollHeight}`);
      // The OUTERMOST elements that end below the window while their parent does not.
      const below = [...doc.body.querySelectorAll("*")].filter((el) => {
        const r = el.getBoundingClientRect();
        if (r.height === 0 || r.bottom + se.scrollTop <= vh + 1) return false;
        const p = el.parentElement.getBoundingClientRect();
        return el.parentElement === doc.body || p.bottom + se.scrollTop <= vh + 1;
      }).slice(0, 12).map((el) => {
        const r = el.getBoundingClientRect();
        const s = win.getComputedStyle(el);
        return `${el.tagName}#${el.id}.${String(el.className).slice(0, 50)} top=${Math.round(r.top)} bottom=${Math.round(r.bottom)} pos=${s.position} display=${s.display}`;
      });
      const shell = [...doc.body.children].map((el) => {
        const r = el.getBoundingClientRect();
        return `${el.tagName}#${el.id}.${String(el.className).slice(0, 40)} h=${Math.round(r.height)} hidden=${el.classList.contains("hidden")} display=${win.getComputedStyle(el).display}`;
      });
      // Positioned boxes whose containing block is outside the content scroller escape its
      // clipping and stretch the page itself (a .sr-only label is the classic case).
      const content = doc.querySelector(".doctor-ai-content");
      const escapes = [...doc.body.querySelectorAll("*")].filter((el) => {
        const s = win.getComputedStyle(el);
        if (s.position !== "absolute" && s.position !== "fixed") return false;
        const r = el.getBoundingClientRect();
        if (r.bottom + se.scrollTop <= vh + 1 || s.display === "none") return false;
        return !content || !el.offsetParent || !content.contains(el.offsetParent) || s.position === "fixed";
      }).slice(0, 12).map((el) => {
        const r = el.getBoundingClientRect();
        return `${el.tagName}#${el.id}.${String(el.className).slice(0, 40)} "${(el.textContent || "").trim().slice(0, 40)}" bottom=${Math.round(r.bottom)} offsetParent=${el.offsetParent ? (el.offsetParent.id || el.offsetParent.className || el.offsetParent.tagName) : "none"}`;
      });
      out.textContent = `SCROLLPROBE vh=${vh} page=${se.scrollHeight} body=${doc.body.scrollHeight}\n`
        + `SCROLLERS\n${scrollers.join("\n")}\nBELOW\n${below.join("\n")}\nESCAPES\n${escapes.join("\n")}\nBODY_CHILDREN\n${shell.join("\n")}`;
      if (params.get("toend") === "1") se.scrollTop = se.scrollHeight;
      return;
    }

    // ?glowprobe=<selector,...> reports, for each element, how close it comes to the centre
    // of the hero's radial glow (.doctor-ai-hero::after). axe cannot see through that
    // gradient, so contrast on the hero is computed from this geometry instead: the glow's
    // opacity at the element's nearest point is what actually sits behind its text.
    const glowSel = params.get("glowprobe");
    if (glowSel) {
      const hero = doc.querySelector(".doctor-ai-hero");
      const hr = hero.getBoundingClientRect();
      const after = win.getComputedStyle(hero, "::after");
      const gw = parseFloat(after.width), gh = parseFloat(after.height);
      const gRight = parseFloat(after.right), gTop = parseFloat(after.top);
      // closest-side of a square box is half its side.
      const cx = hr.right - gRight - gw / 2, cy = hr.top + gTop + gh / 2, radius = Math.min(gw, gh) / 2;
      const rows = glowSel.split(",").flatMap((sel) =>
        [...doc.querySelectorAll(sel.trim())].map((el, i) => {
          const r = el.getBoundingClientRect();
          const nx = Math.max(r.left, Math.min(cx, r.right)), ny = Math.max(r.top, Math.min(cy, r.bottom));
          const d = Math.hypot(nx - cx, ny - cy);
          return `${sel.trim()}[${i}] nearest=${d.toFixed(1)} radius=${radius} t=${Math.min(1, d / radius).toFixed(3)}`;
        }));
      out.textContent = `GLOW_DONE hero=${Math.round(hr.width)}x${Math.round(hr.height)} centre=(${Math.round(cx - hr.left)},${Math.round(cy - hr.top)})\n` + rows.join("\n");
      return;
    }

    // ?contrast=<selector,selector> resolves fg/bg and the ratio by hand, for elements
    // axe returns as "incomplete" because it cannot compute their background.
    const manual = params.get("contrast");
    if (manual) {
      const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
      const lum = (rgb) => { const [r, g, b] = rgb; return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b); };
      // Chrome serialises color-mix() as `color(srgb 0.86 0.15 0.15 / 0.06)` — 0-1
      // components, not 0-255 — so a naive number-scrape reads it 255x too dark and
      // drops the alpha. Both forms are handled, and alpha is returned, not ignored.
      const parse = (s) => {
        const n = (s.match(/[\d.]+(?=%?)/g) || []).map(Number);
        const srgb = s.indexOf("color(") === 0;
        const rgb = srgb ? n.slice(0, 3).map((v) => v * 255) : n.slice(0, 3);
        const a = n.length > 3 ? n[3] : 1;
        return { rgb, a };
      };
      // Composite translucent backgrounds over their ancestors the way the browser
      // paints them, instead of skipping to the first opaque one.
      const bgOf = (el) => {
        const stack = [];
        for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
          const cs = win.getComputedStyle(n);
          if (cs.backgroundImage && cs.backgroundImage !== "none") return { rgb: null, why: "background-image on " + (n.id || n.tagName) };
          const c = parse(cs.backgroundColor);
          if (c.a > 0) stack.push(c);
          if (c.a >= 1) break;
        }
        let out = [255, 255, 255];
        for (let i = stack.length - 1; i >= 0; i--) {
          const { rgb, a } = stack[i];
          out = out.map((base, k) => rgb[k] * a + base * (1 - a));
        }
        return { rgb: out };
      };
      const rows = manual.split(",").map((sel) => {
        const el = doc.querySelector(sel.trim());
        if (!el) return sel + " -> NOT FOUND";
        const cs = win.getComputedStyle(el);
        const px = parseFloat(cs.fontSize), wt = Number(cs.fontWeight) || 400;
        const bg = bgOf(el);
        const round = (a) => a.map((v) => Math.round(v)).join(",");
        if (!bg.rgb) return sel.trim() + " UNDECIDABLE (" + bg.why + ")";
        const fg = parse(cs.color).rgb;
        const lf = lum(fg), lb = lum(bg.rgb);
        const ratio = (Math.max(lf, lb) + 0.05) / (Math.min(lf, lb) + 0.05);
        const large = px >= 24 || (px >= 18.66 && wt >= 700);
        const need = large ? 3 : 4.5;
        return sel.trim() + " fg=rgb(" + round(fg) + ") bg=rgb(" + round(bg.rgb) + ") "
          + px + "px/" + wt + " ratio=" + ratio.toFixed(2) + " need=" + need
          + (ratio >= need ? " OK" : " FAIL");
      });
      out.textContent = "CONTRAST_DONE pane=" + pane + "\n" + rows.join("\n");
      return;
    }

    if (runAxe) {
      // axe must run inside the frame's OWN document — it rejects an element that
      // belongs to a different document, so the library is injected into the frame
      // rather than called from the parent.
      await new Promise((resolve, reject) => {
        const s = doc.createElement("script");
        s.src = "/static/_axe.js";
        s.onload = resolve;
        s.onerror = () => reject(new Error("could not load axe into the frame"));
        doc.head.appendChild(s);
      });
      // The viewer is a dialog outside the dashboard; audit it on its own, and stop its
      // status poll so the result is not overwritten.
      if (win.__viewerPoll) win.clearInterval(win.__viewerPoll);
      const axeRoot = params.get("viewer") === "1" ? "#doctorViewer" : "#doctorDashboardView";
      const results = await win.axe.run(doc.querySelector(axeRoot), {
        runOnly: { type: "tag", values: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa"] },
      });
      const lines = [];
      results.violations.forEach((v) => {
        lines.push(`${v.impact || "n/a"}\t${v.id}\t(${v.nodes.length})\t${v.help}`);
        v.nodes.forEach((n) => {
          lines.push("   TARGET: " + JSON.stringify(n.target));
          (n.any || []).forEach((a) => lines.push("   WHY: " + a.message));
        });
      });
      // Report the colour-contrast rule's OWN status, not just the violation count. A
      // count of zero also happens when the rule never ran (incomplete/inapplicable),
      // so the count alone cannot tell a fix from a skip.
      const cc = results.passes.filter((r) => r.id === "color-contrast");
      const status =
        results.violations.some((r) => r.id === "color-contrast") ? "VIOLATED"
        : cc.length ? "PASSED nodes=" + cc[0].nodes.length
        : results.incomplete.some((r) => r.id === "color-contrast") ? "INCOMPLETE"
        : results.inapplicable.some((r) => r.id === "color-contrast") ? "INAPPLICABLE"
        : "ABSENT";
      out.textContent = "AXE_DONE pane=" + pane
        + " violations=" + results.violations.length
        + " passes=" + results.passes.length
        + " CONTRAST_RULE=" + status
        + "\nINCOMPLETE=" + results.incomplete.map(
            (r) => r.id + "[" + r.nodes.length + "]:" + r.nodes.map(
              (n) => String(n.target)).join(" | ")).join(" ;; ")
        + "\n" + lines.join("\n");
    } else {
      out.textContent = "RENDER_OK pane=" + pane;
    }
  } catch (err) {
    out.textContent = "HARNESS_ERROR: " + (err && err.stack ? err.stack : err);
  }
});
</script>
</body>
</html>
