<!--
  TEMPORARY verification harness. Not application code and not served in production —
  created for the redesign's render/accessibility checks and deleted afterwards.

  It loads the real index.html in an iframe, reveals the doctor workspace, and injects
  FIXTURE data so the screens can be rendered and audited without a live login. The
  fixtures exist only to exercise the rendering path; no figure here is claimed to be
  real data, and nothing in the application ships with them.

  ?pane=overview|reviews  selects which pane to show.
  ?axe=1                  runs axe-core inside the frame and writes results to #out.
  ?drill=<tile>           clicks that activity tile and waits for its list to render.
  ?escape=1               (with drill) presses Escape inside the open list.
  ?glowprobe=<sel,...>    distance of each element from the hero's radial glow, for
                          contrast axe cannot compute through the gradient.
  ?overflow=1             reports anything in the hero wider than its box.
  ?scrollto=<sel>         scrolls an element to the top before a screenshot.
-->
<iframe id="frame" src="/static/index.html"></iframe>
<div id="out">BOOTING</div>
<script src="/static/_axe.js"></script>
<script>
const params = new URLSearchParams(location.search);
// ?w= narrows the frame itself, so the app's own media queries fire at that width
// rather than the page merely being clipped.
const frameWidth = params.get("w");
if (frameWidth) document.getElementById("frame").style.width = frameWidth + "px";
// ?vh=1 sizes the frame to the real viewport, so 100vh inside it means what it means in
// the deployed app. Without this the frame is a fixed 1400px tall and anything the app
// positions against 100vh (the sticky sidebar) is measured against the wrong height.
if (params.get("vh") === "1") document.getElementById("frame").style.height = "100vh";
const pane = params.get("pane") || "overview";
const runAxe = params.get("axe") === "1";
const out = document.getElementById("out");

// Same calendar day the app uses (renderDoctorTodaySchedule filters on _istToday()).
const IST_TODAY = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata" }).format(new Date());

const FIXTURES = {

  // A visit brief carrying every kind of row, including the awkward ones: a department

        { name: "hs-CRP", value: 3.6, unit: "mg/L", flag: "high", clinical_date: "2026-09-20", document_id: "d1" },
      ],
      colleague_notes: [
        { consultation_id: "c8", signed_at: "2026-09-24T12:00:00", doctor_name: "Dr. Mihir Thanvi",
          department: "Orthopedics", restricted: false, summary: "Lumbar spondylosis; physiotherapy advised." },
        { consultation_id: "c9", signed_at: "2026-09-23T16:00:00", doctor_name: "Dr. Sunita Panday",
          department: "Psychiatry", restricted: true, summary: null },
      ],
      colleague_prescriptions: [
        { content: "Tab Gabapentin 100 mg BD", restricted: false, approved_at: "2026-09-24T12:05:00",
          doctor_name: "Dr. Mihir Thanvi", department: "Orthopedics" },
      ],
    },
    last_plan: {
      consultation_id: "c3", signed_at: "2026-09-12T11:00:00",
      plan: "Restrict salt; repeat renal panel in two weeks.",
      approved_items: [{ kind: "prescription", content: "Tab Furosemide 20 mg OD" }],
    },
    has_documents: true,
  },
  // What /appointments/{id}/nutrition returns, with a kidney conflict so the caution shows.
  nutrition: {
    items: [{
      kind: "finding", term: "Vitamin D", direction: "low",
      because: [{ printed_name: "Vitamin D, 25-Hydroxy (Total)", value_text: "13.8 ng/mL", flag: "low",
                  document_type: "blood_report", clinical_date: "2026-09-20", page_no: 2, document_id: "d1" }],
      nutrient_focus: "Vitamin D, with calcium to use it well.",
      veg_foods: ["Fortified milk", "Curd", "Paneer", "Ragi"], non_veg_foods: ["Salmon", "Sardines", "Egg yolk"],
      limit: [], note: "Pair with calcium-rich foods.",
    }, {
      kind: "symptom", term: "constipation", direction: "present", because: [{ symptom: "constipation" }],
      nutrient_focus: "Fibre and fluids.", veg_foods: ["Oats", "Papaya", "Whole wheat"],
      non_veg_foods: ["Oats", "Papaya"], limit: ["Refined flour"], note: "",
    }],
    cautions: ["Kidney results are abnormal — agree any diet change with a renal dietitian. High-potassium and high-protein foods have been left out."],
    unavailable: [], excluded_documents: 1, prompt_version: "nutrition-v1",
  },
  // Drill-down rows behind each activity tile (?drill=<tile>). Each set includes the
  // awkward case: a discarded consult's note, which is listed but must NOT be a button.
  items: (() => {
    const base = { consultation_id: "c1", booking_id: "b1", patient_id: "p1",
      patient_name: "Anit Rao", department: "Nephrology",
      appointment_start: "2026-09-21T13:00:00", consult_status: "transcript_ready",
      consult_ended_at: "2026-09-21T13:30:00", note_status: "draft", openable: true };
    const discarded = { ...base, consultation_id: "c9", booking_id: "b9",
      patient_name: "Priya Menon", consult_status: "discarded", openable: false };
    const wrap = (tile, items) => ({ tile, window_requested: "last_visit",
      window: "last_visit", window_start: "2026-09-21T09:00:00", items, truncated: false });
    return {
      notes_drafted: wrap("notes_drafted", [
        { ...base, occurred_at: "2026-09-22T19:12:00", style: "detailed" },
        { ...base, occurred_at: "2026-09-22T11:02:00", style: "concise", note_status: "signed" },
        { ...discarded, occurred_at: "2026-09-22T09:40:00", style: "concise" },
      ]),
      documents_summarized: wrap("documents_summarized", [
        { document_id: "d1", original_filename: "Lab_Report_20Sep2026.pdf",
          document_type: "lab_report", clinical_date: "2026-09-20",
          uploaded_at: "2026-09-22T08:00:00", content_type: "application/pdf",
          patient_id: "p1", patient_name: "Anit Rao", summary_verification: "partial", openable: true },
        { document_id: "d2", original_filename: "prescription-photo.png",
          document_type: "prescription", clinical_date: null,
          uploaded_at: "2026-09-22T07:00:00", content_type: "image/png",
          patient_id: "p1", patient_name: "Anit Rao", summary_verification: "failed", openable: true },
      ]),
      fields_flagged: wrap("fields_flagged", [
        { ...base, occurred_at: "2026-09-22T19:12:00", flagged_sections: ["objective", "assessment"] },
        { ...base, consultation_id: "c3", patient_name: "Priya Menon",
          occurred_at: "2026-09-21T12:05:00", flagged_sections: ["plan"] },
      ]),
      notes_blocked: wrap("notes_blocked", [
        { ...base, consultation_id: "c2", note_status: "stale", occurred_at: "2026-09-21T16:35:00" },

  })(),
  // The real incident: the assistant proposed Endocrinology off a cortisol result and the
  // patient insisted on Psychiatry. The panel must make that visible, not average it out.
  bookingContext: {
    recorded: true,
    context: {
      booking_id: "b1", patient_id: "p1",
      transcript_message_count: 24,
      suggested_department: "Endocrinology",
      chosen_department: "Psychiatry",
      department_match_source: "document_findings",
      department_match_reason: "raised morning cortisol on the blood report",
      document_ids: ["d1", "d2"],
      ai_summary: {}, ai_summary_status: "pending",
    },
  },
  patient: {
    patient_id: "p1", patient_name: "Anit Rao", name: "Anit Rao", age: 27,
    email: "anit@example.com", mobile_number: "9999999999", blood_group: "B+",
    health_issues: "Vitamin B12 deficiency. Occasional anxiety.",
    visits: [{ booking_id: "b1", start_time: "2026-09-21T13:00:00",
               department: "Nephrology", status: "completed",
               consult_id: "c1", consult_status: "transcript_ready", note_status: "draft",
               consult_ended_at: "2026-09-21T13:30:00" }],
  },

    { booking_id: "b1", patient_id: "p1", patient_name: "Anit Rao", department: "Nephrology",
      start_time: IST_TODAY + "T09:00:00", status: "completed",

    { booking_id: "b9", patient_id: "p2", patient_name: "Priya Menon", department: "Nephrology",
      start_time: IST_TODAY + "T14:30:00", status: "booked",
      consult_id: null, consult_status: null, consult_started_at: null, consult_ended_at: null },

// Declared out here, above the fetch interception that serves them, so the interceptor
// closure cannot reach them in their temporal dead zone.
const NOTE = {
  id: "note-1", consultation_id: "c1", status: "draft",
  subjective: "Patient reports anxiety and difficulty sleeping for several days.",
  objective: "BP 130/80. Alert, oriented. No acute distress.",
  assessment: "Likely stress-related insomnia. Raised morning cortisol on recent labs.",
  plan: ["- Sleep hygiene advice", "- Amlodipine 5 mg once daily", "- Review in 2 weeks"].join(String.fromCharCode(10)),
  field_citations: { subjective: ["I have been feeling anxious"], objective: [],
                     assessment: [], plan: ["review in two weeks"] },
  confidence_flags: { subjective: false, objective: true, assessment: true, plan: false },
  generated_at: "2026-09-22T19:12:00", edited_at: null, signed_at: null,
  shared_with_patient_at: null, source_transcript_type: "batch",
  ai_model: "gpt-4o-mini", ai_prompt_version: "v1-concise", addenda: [],
};
const SIGNED = { ...NOTE, status: "signed", signed_at: "2026-09-23T10:05:00",
  shared_with_patient_at: "2026-09-23T10:11:00",
  addenda: [{ id: "a1", content: "Patient called; tolerating medication well.",
              added_by: "d1", created_at: "2026-09-23T12:00:00" }] };

document.getElementById("frame").addEventListener("load", async () => {
  const frame = document.getElementById("frame");
  const win = frame.contentWindow;
  const doc = frame.contentDocument;

  try {
    // Every request the app makes, in order, with its method and body — so a flow can be
    // checked for WHAT it sent and in WHICH order (save before sign), not just what painted.
    win.__requests = [];
    // ?fail=clinical-put makes the clinical-item save fail, to prove approve stops.
    const failures = (params.get("fail") || "").split(",").filter(Boolean);
    const reply = (body, status = 200) => ({
      ok: status < 400, status, json: async () => body, text: async () => JSON.stringify(body),
    });

    // Intercept the workspace's own fetches so render paths run exactly as they do in
    // production, just against fixtures instead of a live API.
    win.fetch = async (url, options = {}) => {
      const u = String(url);
      const method = String(options.method || "GET").toUpperCase();
      win.__requests.push({ method, url: u, body: options.body || null });
      if (failures.includes("clinical-put") && method === "PUT" && u.includes("/clinical-items/")) {
        return reply({ detail: "Simulated save failure" }, 500);
      }
      // ?generateflow=1: drafting a note takes a while, as a model call does; ?fail=generate
      // makes it fail the way the server did ("Could not generate a structured note").
      // ?discardflow=1: the server's answer to a discard — the consult, now discarded.
      if (method === "POST" && u.endsWith("/discard")) {
        return reply({ id: "c1", status: "discarded", started_at: "2026-09-21T13:00:00",
                       ended_at: "2026-09-21T13:04:12" });
      }
      if (method === "POST" && u.includes("/soap/generate")) {
        await new Promise((r) => win.setTimeout(r, 1500));
        return failures.includes("generate")
          ? reply({ detail: "Could not generate a structured clinical note from this transcript. Please try again." }, 502)
          : reply(NOTE);
      }
      // ?race=1: two patients whose overview cards arrive in the WRONG order — A's is slow
      // (as a card needing the model is), B's instant (as a cached one is).
      const race = params.get("race") === "1" && u.match(/\/doctor\/patients\/(p[AB])(\/[a-z-]+)?$/);
      if (race) {
        const who = race[1], sub = race[2] || "";
        if (sub === "/overview") {
          if (who === "pA") await new Promise((r) => win.setTimeout(r, 600));
          return reply({ mode: "structured", reason: "", facts: [], lines: [
            { heading: "Diagnoses", items: [{ text: `DIAGNOSIS OF PATIENT ${who.slice(1)}`, label: null }] },
          ] });
        }
        if (sub === "") {
          return reply({ patient_id: who, patient_name: `Patient ${who.slice(1)}`,
                         name: `Patient ${who.slice(1)}`, visits: [] });
        }
        return reply({});
      }
      let body = {};
      if (u.includes("/doctor/me")) body = { doctor: FIXTURES.doctor };
      else if (u.includes("activity-items")) {
        body = FIXTURES.items[new URL(u, location.href).searchParams.get("tile")] || {};
      }
      else if (u.includes("activity-summary")) body = FIXTURES.summary;
      else if (u.includes("activity-log")) body = FIXTURES.log;
      else if (u.includes("/doctor/reviews")) {
        body = u.includes("scope=completed") ? FIXTURES.reviewsCompleted : FIXTURES.reviews;
      }
      else if (u.endsWith("/doctor/patients/p1")) body = FIXTURES.patient;
      // BEFORE the /doctor/appointments branch: the context URL is
      // /doctor/appointments/{id}/context and would otherwise be shadowed by it.
      else if (u.includes("/context")) body = FIXTURES.bookingContext;
      // BEFORE the /doctor/appointments branch too: /doctor/appointments/{id}/brief.
      else if (u.includes("/brief")) body = FIXTURES.brief;
      else if (u.includes("/nutrition")) body = FIXTURES.nutrition;
      else if (u.includes("/doctor/appointments")) body = FIXTURES.appointments;
      // The note must come from HERE, not from a renderNoteDraft() call in this harness.
      // loadSoapNote() assigns the app's own module-level doctorCurrentNote and then
      // re-renders; a direct render call is overwritten by that async continuation, which
      // left the SOAP fields empty and meant axe was auditing a blank note.
      else if (u.includes("/soap/verified-sections")) body = { sections: [] };
      else if (u.includes("/soap")) body = pane === "signed" ? SIGNED : NOTE;
      else if (u.includes("/transcript")) body = FIXTURES.transcript;
      else if (u.includes("/clinical-item")) body = FIXTURES.clinicalItem;
      else if (u.includes("/patient/")) body = FIXTURES.patient;
      return reply(body);
    };

    // Only the TOP-LEVEL view sections — the workspace's own panes contain nested
    // <section> elements (hero, cards, lanes) that must stay visible.
    doc.querySelectorAll("body > section").forEach((s) => s.classList.add("hidden"));
    const dash = doc.querySelector("#doctorDashboardView");
    dash.classList.remove("hidden");
    dash.querySelectorAll(".doctor-ai-side, .doctor-ai-main, .doctor-ai").forEach(
      (el) => el.classList.remove("hidden"));

    // The workspace's state lives in top-level `let` bindings, which a classic script
    // does NOT expose on window — assigning win.doctorReviewsCache would create a
    // separate property the app never reads. So the real loader functions are driven
    // instead, and they populate their own state from the intercepted fetch above. That
    // also means these screenshots exercise the genuine load path, not a shortcut.
    win.renderDoctorDashboard(FIXTURES.doctor);
    await win.loadDoctorReviews();
    await win.loadDoctorAppointments("upcoming");
    await win.loadDoctorAiActivity();
    win.showDoctorView(pane);

    // ?drill=<tile> opens that tile's list by CLICKING it — the real handler, not a direct
    // render — and waits for rows. "Loading…" is itself a message element, so readiness is
    // "rows exist, or a message that is not the loading one".
    const drill = params.get("drill");
    if (drill) {
      const tile = doc.querySelector(`[data-activity-tile="${drill}"]`);
      if (!tile) throw new Error("no activity tile for " + drill);
      tile.click();
      const ready = () => {
        const list = doc.querySelector("#doctorActivityDrillList");
        if (!list) return false;
        if (list.querySelector(".doctor-ai-drill-row")) return true;
        const msg = list.querySelector(".doctor-ai-drill-message");
        return Boolean(msg && msg.textContent !== "Loading…");
      };
      for (let i = 0; i < 40 && !ready(); i++) await new Promise((r) => win.setTimeout(r, 50));
      if (!ready()) throw new Error("the drill-down never rendered for " + drill);

      // ?escape=1 presses Escape from inside the open list, the keyboard way out. The
      // panel must close AND focus must land back on the tile that opened it.
      if (params.get("escape") === "1") {
        const row = doc.querySelector("#doctorActivityDrillList button") || doc.querySelector("#doctorActivityDrillClose");
        row.focus();
        row.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      }
    }


  // ── Screens inside the appointment-detail pane (verification-report.md 7.4) ──
  if (pane === 'note' || pane === 'signed' || pane === 'clinical' || pane === 'patient') {
    const appt = { booking_id:'b1', patient_id:'p1', patient_name:'Anit Rao',
      department:'Nephrology', start_time:'2026-09-21T13:00:00', status:'completed',
      booking_note:null, consult_id:'c1', consult_status:'transcript_ready',
      consult_started_at:null, consult_ended_at:'2026-09-21T13:30:00' };

    if (pane === 'patient') {

        await new Promise((r) => win.setTimeout(r, 400));
      }
      // ?nutrition=veg|non_veg opens the AI nutritionist and picks that diet.
      if (params.get("nutrition")) {
        await new Promise((r) => win.setTimeout(r, 600));
        doc.querySelector(".doctor-nutrition-toggle")?.click();
        await new Promise((r) => win.setTimeout(r, 500));
        if (params.get("nutrition") === "non_veg") {
          [...doc.querySelectorAll(".doctor-nutrition-diet")].find((b) => b.textContent === "Non-vegetarian")?.click();
          await new Promise((r) => win.setTimeout(r, 200));
        }
        doc.querySelector(".doctor-nutrition")?.scrollIntoView();
      }
      // Polled by CDP in REAL time — --virtual-time-budget fast-forwards timers and
      // breaks PDF.js's worker handshake, so it cannot be used to verify this.
      win.__viewerPoll = win.setInterval(() => {
        const canvas = doc.querySelector("#doctorViewerCanvas");
        const status = doc.querySelector("#doctorViewerStatus")?.textContent || "";
        out.textContent = "VIEWER canvas=" + canvas.width + "x" + canvas.height
          + " page=" + (doc.querySelector("#doctorViewerPage")?.textContent || "")
          + " abnormal=" + doc.querySelectorAll(".doctor-abnormal-list li").length
          + " groups=" + JSON.stringify([...doc.querySelectorAll("#doctorViewerSummary > .admin-inline-meta")].map((el) => el.textContent))
          + " heading=" + JSON.stringify(doc.querySelector(".doctor-abnormal-heading")?.textContent || "")
          + " sentences=" + doc.querySelectorAll("#doctorViewerSummary .clinical-note-line").length
          + " incomplete=" + Boolean(doc.querySelector(".doctor-completeness-warn"))
          + " review=" + JSON.stringify((doc.querySelector(".doctor-review-block")?.textContent || "").replace(/\s+/g, " ").trim())
          + " posted=" + JSON.stringify(win.__reviewPosted || null)
          + " nutrition=" + JSON.stringify({
            items: doc.querySelectorAll(".doctor-nutrition-item").length,
            pressed: doc.querySelector(".doctor-nutrition-diet[aria-pressed='true']")?.textContent || null,
            first: (doc.querySelector(".doctor-nutrition-item")?.textContent || "").replace(/\s+/g, " ").slice(0, 400),
          })
          + " status=" + JSON.stringify(status);
      }, 300);
      if (!runAxe && !params.get("inspect") && !params.get("contrast")) return;
    }

    // ?inspect=<selector,selector> reports each element's text, hidden state and key
    // attributes — the frame's DOM is not in --dump-dom, so this is how frame state is
    // read back.
    const inspect = params.get("inspect");
    if (inspect) {
      const rows = inspect.split(",").map((sel) => {
        const els = [...doc.querySelectorAll(sel.trim())];
        if (!els.length) return sel.trim() + " -> NOT FOUND";
        return els.map((el, i) => {
          const cs = win.getComputedStyle(el);
          const text = (el.textContent || "").trim().replace(/\s+/g, " ").slice(0, 90);
          return `${sel.trim()}[${i}] <${el.tagName.toLowerCase()}> vis=${cs.display !== "none" && cs.visibility !== "hidden"}`
            + ` active=${el.classList.contains("is-active")}`
            + ` pressed=${el.getAttribute("aria-pressed")}`
            + ` expanded=${el.getAttribute("aria-expanded")}`
            + ` focused=${doc.activeElement === el}`
            + ` text="${text}"`;
        }).join("\n");
      });
      out.textContent = "INSPECT_DONE pane=" + pane + "\n" + rows.join("\n");
      return;
    }

    // ?scrollto=<selector> brings an element to the top of the frame before a screenshot —
    // at narrow widths the stacked sidebar pushes the content below the fold.
    const scrollTo = params.get("scrollto");
    if (scrollTo) doc.querySelector(scrollTo)?.scrollIntoView({ block: "start" });

    // ?overflow=1 reports any element in the hero wider than its box — the layout failure
    // a narrow screen produces and a screenshot at desktop width cannot show.
    if (params.get("overflow") === "1") {
      const hero = doc.querySelector(".doctor-ai-hero");
      const bad = [...hero.querySelectorAll("*")].filter((el) => el.scrollWidth > el.clientWidth + 1
        && win.getComputedStyle(el).overflowX !== "auto" && win.getComputedStyle(el).overflowX !== "scroll"
        && el.clientWidth > 0);
      const hr = hero.getBoundingClientRect();
      const escaping = [...hero.querySelectorAll(".doctor-ai-drill-row, .doctor-ai-tile")].filter((el) => {
        const r = el.getBoundingClientRect(); return r.right > hr.right + 0.5 || r.left < hr.left - 0.5;
      });
      out.textContent = `OVERFLOW_DONE hero=${Math.round(hr.width)} overflowing=${bad.length} escaping=${escaping.length}\n`
        + bad.slice(0, 10).map((el) => `${el.className || el.tagName} scroll=${el.scrollWidth} client=${el.clientWidth}`).join("\n");
      return;
    }

    // ?glowprobe=<selector,...> reports, for each element, how close it comes to the centre
    // of the hero's radial glow (.doctor-ai-hero::after). axe cannot see through that
    // gradient, so contrast on the hero is computed from this geometry instead: the glow's
    // opacity at the element's nearest point is what actually sits behind its text.
    const glowSel = params.get("glowprobe");
    if (glowSel) {
      const hero = doc.querySelector(".doctor-ai-hero");
      const hr = hero.getBoundingClientRect();
      const after = win.getComputedStyle(hero, "::after");
      const gw = parseFloat(after.width), gh = parseFloat(after.height);
      const gRight = parseFloat(after.right), gTop = parseFloat(after.top);
      // closest-side of a square box is half its side.
      const cx = hr.right - gRight - gw / 2, cy = hr.top + gTop + gh / 2, radius = Math.min(gw, gh) / 2;
      const rows = glowSel.split(",").flatMap((sel) =>
        [...doc.querySelectorAll(sel.trim())].map((el, i) => {
          const r = el.getBoundingClientRect();
          const nx = Math.max(r.left, Math.min(cx, r.right)), ny = Math.max(r.top, Math.min(cy, r.bottom));
          const d = Math.hypot(nx - cx, ny - cy);
          return `${sel.trim()}[${i}] nearest=${d.toFixed(1)} radius=${radius} t=${Math.min(1, d / radius).toFixed(3)}`;
        }));
      out.textContent = `GLOW_DONE hero=${Math.round(hr.width)}x${Math.round(hr.height)} centre=(${Math.round(cx - hr.left)},${Math.round(cy - hr.top)})\n` + rows.join("\n");
      return;
    }

    // ?contrast=<selector,selector> resolves fg/bg and the ratio by hand, for elements
    // axe returns as "incomplete" because it cannot compute their background.
    const manual = params.get("contrast");
    if (manual) {
      const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
      const lum = (rgb) => { const [r, g, b] = rgb; return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b); };
      // Chrome serialises color-mix() as `color(srgb 0.86 0.15 0.15 / 0.06)` — 0-1
      // components, not 0-255 — so a naive number-scrape reads it 255x too dark and
      // drops the alpha. Both forms are handled, and alpha is returned, not ignored.
      const parse = (s) => {
        const n = (s.match(/[\d.]+(?=%?)/g) || []).map(Number);
        const srgb = s.indexOf("color(") === 0;
        const rgb = srgb ? n.slice(0, 3).map((v) => v * 255) : n.slice(0, 3);
        const a = n.length > 3 ? n[3] : 1;
        return { rgb, a };
      };
      // Composite translucent backgrounds over their ancestors the way the browser
      // paints them, instead of skipping to the first opaque one.
      const bgOf = (el) => {
        const stack = [];
        for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
          const cs = win.getComputedStyle(n);
          if (cs.backgroundImage && cs.backgroundImage !== "none") return { rgb: null, why: "background-image on " + (n.id || n.tagName) };
          const c = parse(cs.backgroundColor);
          if (c.a > 0) stack.push(c);
          if (c.a >= 1) break;
        }
        let out = [255, 255, 255];
        for (let i = stack.length - 1; i >= 0; i--) {
          const { rgb, a } = stack[i];
          out = out.map((base, k) => rgb[k] * a + base * (1 - a));
        }
        return { rgb: out };
      };
      const rows = manual.split(",").map((sel) => {
        const el = doc.querySelector(sel.trim());
        if (!el) return sel + " -> NOT FOUND";
        const cs = win.getComputedStyle(el);
        const px = parseFloat(cs.fontSize), wt = Number(cs.fontWeight) || 400;
        const bg = bgOf(el);
        const round = (a) => a.map((v) => Math.round(v)).join(",");
        if (!bg.rgb) return sel.trim() + " UNDECIDABLE (" + bg.why + ")";
        const fg = parse(cs.color).rgb;
        const lf = lum(fg), lb = lum(bg.rgb);
        const ratio = (Math.max(lf, lb) + 0.05) / (Math.min(lf, lb) + 0.05);
        const large = px >= 24 || (px >= 18.66 && wt >= 700);
        const need = large ? 3 : 4.5;
        return sel.trim() + " fg=rgb(" + round(fg) + ") bg=rgb(" + round(bg.rgb) + ") "
          + px + "px/" + wt + " ratio=" + ratio.toFixed(2) + " need=" + need
          + (ratio >= need ? " OK" : " FAIL");
      });
      out.textContent = "CONTRAST_DONE pane=" + pane + "\n" + rows.join("\n");
      return;
    }

    if (runAxe) {
      // axe must run inside the frame's OWN document — it rejects an element that
      // belongs to a different document, so the library is injected into the frame
      // rather than called from the parent.
      await new Promise((resolve, reject) => {
        const s = doc.createElement("script");
        s.src = "/static/_axe.js";
        s.onload = resolve;
        s.onerror = () => reject(new Error("could not load axe into the frame"));
        doc.head.appendChild(s);
      });
      // The viewer is a dialog outside the dashboard; audit it on its own, and stop its
      // status poll so the result is not overwritten.
      if (win.__viewerPoll) win.clearInterval(win.__viewerPoll);
      const axeRoot = params.get("viewer") === "1" ? "#doctorViewer" : "#doctorDashboardView";
      const results = await win.axe.run(doc.querySelector(axeRoot), {
        runOnly: { type: "tag", values: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa"] },
      });
      const lines = [];
      results.violations.forEach((v) => {
        lines.push(`${v.impact || "n/a"}\t${v.id}\t(${v.nodes.length})\t${v.help}`);
        v.nodes.forEach((n) => {
          lines.push("   TARGET: " + JSON.stringify(n.target));
          (n.any || []).forEach((a) => lines.push("   WHY: " + a.message));
        });
      });
      // Report the colour-contrast rule's OWN status, not just the violation count. A
      // count of zero also happens when the rule never ran (incomplete/inapplicable),
      // so the count alone cannot tell a fix from a skip.
      const cc = results.passes.filter((r) => r.id === "color-contrast");
      const status =
        results.violations.some((r) => r.id === "color-contrast") ? "VIOLATED"
        : cc.length ? "PASSED nodes=" + cc[0].nodes.length
        : results.incomplete.some((r) => r.id === "color-contrast") ? "INCOMPLETE"
        : results.inapplicable.some((r) => r.id === "color-contrast") ? "INAPPLICABLE"
        : "ABSENT";
      out.textContent = "AXE_DONE pane=" + pane
        + " violations=" + results.violations.length
        + " passes=" + results.passes.length
        + " CONTRAST_RULE=" + status
        + "\nINCOMPLETE=" + results.incomplete.map(
            (r) => r.id + "[" + r.nodes.length + "]:" + r.nodes.map(
              (n) => String(n.target)).join(" | ")).join(" ;; ")
        + "\n" + lines.join("\n");
    } else {
      out.textContent = "RENDER_OK pane=" + pane;
    }
  } catch (err) {
    out.textContent = "HARNESS_ERROR: " + (err && err.stack ? err.stack : err);
  }
});
</script>
</body>
</html>
